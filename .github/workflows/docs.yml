name: Deploy docs

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: playground/package-lock.json

      - name: Install MkDocs
        run: pip install mkdocs-material

      # The amlint wheel the browser installs, the CodeMirror bundle and the examples,
      # into docs/playground/dist/
      - name: Build the playground
        run: python playground/build.py

      # All pages in one file for AI assistants, published next to the hand-written docs/llms.txt
      - name: Build llms-full.txt
        run: python scripts/build_llms_full.py

      - name: Build the site
        run: mkdocs build --strict

      - name: Smoke-test the playground in headless Chromium
        working-directory: playground
        run: |
          npx playwright install --with-deps chromium
          python -m http.server 8000 --bind 127.0.0.1 --directory ../site &
          for _ in $(seq 30); do curl -sf -o /dev/null http://127.0.0.1:8000/ && break; sleep 1; done
          node smoke-test.mjs http://127.0.0.1:8000/playground/

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push'
        run: mkdocs gh-deploy --force

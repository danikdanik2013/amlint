name: 'amlint'
description: 'Semantic linter for Prometheus Alertmanager configs — catches what amtool misses.'
author: 'Danyil'
branding:
  icon: 'shield'
  color: 'blue'

inputs:
  config-path:
    description: 'Path to the alertmanager.yml file to lint'
    required: true
  strict:
    description: "Exit non-zero on WARN as well as ERROR ('true'/'false')"
    required: false
    default: 'false'
  ignore:
    description: 'Comma-separated check codes to skip, e.g. empty-receiver,unused-receiver'
    required: false
    default: ''
  only:
    description: 'Comma-separated check codes to run exclusively'
    required: false
    default: ''
  version:
    description: 'amlint version to install, e.g. 0.2.0 (defaults to latest from PyPI)'
    required: false
    default: ''
  sarif:
    description: "Also upload findings to GitHub Code Scanning as SARIF ('true'/'false'). Requires Code Scanning to be enabled on the repo."
    required: false
    default: 'false'

runs:
  using: 'composite'
  steps:
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'

    - name: Install amlint
      shell: bash
      run: |
        if [ -n "${{ inputs.version }}" ]; then
          pip install "amlint==${{ inputs.version }}"
        else
          pip install amlint
        fi

    - name: Run amlint check
      id: check
      shell: bash
      continue-on-error: true
      run: |
        set -- check "${{ inputs.config-path }}"
        [ "${{ inputs.strict }}" = "true" ] && set -- "$@" --strict
        [ -n "${{ inputs.ignore }}" ] && set -- "$@" --ignore "${{ inputs.ignore }}"
        [ -n "${{ inputs.only }}" ] && set -- "$@" --only "${{ inputs.only }}"
        amlint "$@"

    - name: Run amlint check (SARIF)
      if: inputs.sarif == 'true'
      shell: bash
      run: |
        amlint check "${{ inputs.config-path }}" --format sarif --exit-zero > amlint-results.sarif

    - name: Upload SARIF to Code Scanning
      if: inputs.sarif == 'true'
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: amlint-results.sarif

    - name: Fail if amlint found issues
      if: steps.check.outcome == 'failure'
      shell: bash
      run: exit 1

# A kube-prometheus style config Secret: alertmanager.yaml in stringData, and a template
# file that the operator mounts next to it in /etc/alertmanager/config.
apiVersion: v1
kind: Secret
metadata:
  name: alertmanager-main
  namespace: monitoring
type: Opaque
stringData:
  alertmanager.yaml: |-
    global:
      resolve_timeout: 5m
    route:
      receiver: default
      group_by: [namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: ['alertname = "Watchdog"']
          receiver: "null"
        - matchers: ["severity = critical"]
          receiver: oncall
    inhibit_rules:
      - source_matchers: ["severity = critical"]
        target_matchers: ["severity =~ warning|info"]
        equal: [namespace, alertname]
    receivers:
      - name: default
        webhook_configs:
          - url: http://alert-gateway.monitoring.svc:8080/alerts
      - name: "null"
      - name: oncall
        pagerduty_configs:
          - routing_key_file: /etc/alertmanager/secrets/pagerduty/routing-key
            description: '{{ template "notify.description" . }}'
    templates:
      - /etc/alertmanager/config/*.tmpl
  notify.tmpl: |-
    {{ define "notify.description" }}{{ .CommonLabels.alertname }} in {{ .CommonLabels.namespace }}{{ end }}

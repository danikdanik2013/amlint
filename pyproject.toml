[project]
name = "amlint"
version = "0.5.0"
description = "Linter for Prometheus Alertmanager configs: finds misrouted, unreachable and over-inhibited alerts, simulates routing and tests it in CI"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [{name = "danikdanik2013"}]
keywords = [
    "alertmanager", "prometheus", "linter", "lint", "amtool", "alerting", "routing",
    "inhibition", "monitoring", "observability", "sre", "devops", "kubernetes",
    "prometheus-operator", "mimir", "ci",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = ["pyyaml>=5.1", "rich>=13"]

[project.optional-dependencies]
dev = [
    "pytest>=7", "pytest-cov>=4", "ruff>=0.4", "argcomplete>=3", "hypothesis>=6.80",
    "tomli>=2; python_version<'3.11'",
]
completions = ["argcomplete>=3"]
docs = ["mkdocs-material>=9"]

[project.urls]
Homepage = "https://github.com/danikdanik2013/amlint"
Documentation = "https://danikdanik2013.github.io/amlint/"
Playground = "https://danikdanik2013.github.io/amlint/playground/"
Changelog = "https://github.com/danikdanik2013/amlint/blob/main/CHANGELOG.md"
Repository = "https://github.com/danikdanik2013/amlint"
"Bug Tracker" = "https://github.com/danikdanik2013/amlint/issues"

[project.scripts]
amlint = "amlint.cli:main"

[tool.setuptools.packages.find]
include = ["amlint*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"
